<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="square">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <!-- macOS icon grid: an 824 pt rounded square in a 1024 pt canvas; Swiss
       style, paper, ink and one red -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#f2ead8" filter="url(#shadow)"/>
  <g clip-path="url(#square)">
    <!-- the band, with the name -->
    <rect x="100" y="100" width="824" height="270" fill="#e6382f"/>
    <text x="160" y="320" font-family="Helvetica Neue, Helvetica, Arial" font-weight="bold"
          font-size="220" fill="#f2ead8" letter-spacing="-10">wtf</text>

    <!-- the main line, and a branch off it at a right angle -->
    <path d="M170 700 H870" stroke="#141414" stroke-width="40"/>
    <path d="M400 700 V530 H720" stroke="#141414" stroke-width="40" fill="none"/>

    <!-- commits: the main line's in ink, the branch's in red -->
    <circle cx="250" cy="700" r="70" fill="#141414"/>
    <circle cx="400" cy="700" r="70" fill="#141414"/>
    <circle cx="580" cy="530" r="70" fill="#e6382f"/>

    <!-- worktrees: filled with uncommitted changes, outlined when clean -->
    <rect x="700" y="460" width="140" height="140" fill="#e6382f"/>
    <rect x="720" y="630" width="140" height="140" fill="#f2ead8" stroke="#141414" stroke-width="30"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#000" stroke-opacity="0.1" stroke-width="2"/>
</svg>
