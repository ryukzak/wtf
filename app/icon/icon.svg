<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34404d"/>
      <stop offset="1" stop-color="#1b2128"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: an 824 pt rounded square in a 1024 pt canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- main lane -->
  <path d="M250 632 H640" stroke="#7fb0e6" stroke-width="30" stroke-linecap="round" fill="none"/>
  <!-- a branch forks off the main lane -->
  <path d="M370 632 C 470 632, 450 392, 560 392 H 740" stroke="#b3a0eb" stroke-width="30" stroke-linecap="round" fill="none"/>

  <!-- commits -->
  <circle cx="250" cy="632" r="42" fill="#7fb0e6"/>
  <circle cx="370" cy="632" r="42" fill="#7fb0e6"/>
  <circle cx="510" cy="632" r="42" fill="#7fb0e6"/>
  <circle cx="560" cy="392" r="42" fill="#b3a0eb"/>
  <circle cx="670" cy="392" r="42" fill="#b3a0eb"/>

  <!-- worktrees: filled with uncommitted changes, outlined when clean -->
  <rect x="740" y="344" width="96" height="96" rx="16" fill="#e6739f"/>
  <rect x="628" y="590" width="84" height="84" rx="14" fill="#1f262e" stroke="#7fb0e6" stroke-width="16"/>
</svg>
